[project]
name = "lab-common"
version = "0.1.0"
description = "Shared platform lib: skill loader, agent runner, eval harness"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "claude-agent-sdk>=0.2",
    "deepeval>=4.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pydantic>=2",
    "mcp>=1.2",
    "pyjwt>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lab_common"]
