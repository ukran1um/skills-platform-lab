[project]
name = "skills-platform-lab"
version = "0.1.0"
description = "Governed skills platform prototype: registry monorepo, eval-gated CI, capability-token MCP, skill host"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["data", "skills/*", "common"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
# Anchor rootdir at the repo root so the workspace-wide conftest.py is always loaded.
addopts = []
