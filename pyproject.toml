[project]
name = "skills-platform-lab"
version = "0.1.0"
description = "Governed skills platform prototype: registry monorepo, eval-gated CI, capability-token MCP, skill host"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["data", "skills/*", "common", "services/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["\\.venv"]
# Each skill ships its own tests/ with the same basenames (e.g. test_fetch.py); without this
# mypy can't disambiguate same-named modules across skills. Treat dirs on the path as bases.
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
# Anchor rootdir at the repo root so the workspace-wide conftest.py is always loaded.
# Default run excludes live evals (they call the Anthropic API); run them with `pytest -m eval`.
# importlib import mode: lets each skill ship a tests/ with the same basenames (test_fetch.py
# etc.) without sys.path basename collisions (the default prepend mode rejects duplicates).
addopts = "-m 'not eval' --import-mode=importlib"
markers = [
    "eval: live evals that call the Anthropic API (needs ANTHROPIC_API_KEY); deselected by default",
]
