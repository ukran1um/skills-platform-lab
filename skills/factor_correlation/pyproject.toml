[project]
name = "factor-correlation"
version = "0.1.0"
description = "Pearson correlation of daily returns between tickers"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factor_correlation"]
