cases:
  - id: corr_two_tickers
    input: "How correlated were AAPL and MSFT daily returns from 2025-01-01 to 2025-06-30?"
    checks:
      - type: deterministic
        tool: compute_correlation
        field: correlation_value
        tolerance: 0.01
      - type: trajectory
        must_call: [compute_correlation]
      - type: judge
        # Judge only presentation, not numeric correctness — the deterministic check
        # already verifies the value. Telling the judge NOT to verify numbers avoids
        # the false-negative failure mode where a weak judge calls any unverifiable
        # figure "fabricated" (see LEARNINGS 2026-06-09).
        rubric: >
          The answer states a single correlation number, says explicitly that it is a
          correlation of DAILY RETURNS (not price levels), and names the date window.
          Judge ONLY these presentation criteria; do NOT attempt to verify the numeric
          value itself (a separate check covers correctness).
        min_score: 0.7

  - id: corr_three_tickers
    input: "Give me the correlation matrix of AAPL, MSFT and NVDA daily returns over the first half of 2025 (2025-01-01 to 2025-06-30)."
    checks:
      - type: trajectory
        must_call: [compute_correlation]
      - type: judge
        # Scope the judge to presentation only. "No fabricated numbers" was removed:
        # a weak judge read it as "must be independently verifiable" and failed good
        # answers 0/0/0 (see LEARNINGS 2026-06-09). The judge cannot see the tool's
        # numbers anyway, so number-faithfulness is not its job.
        rubric: >
          The answer reports correlations for all three pairs among AAPL, MSFT, NVDA
          (as a matrix or the set of pairs), and explicitly describes them as
          DAILY-RETURN correlations (not price levels), and names the date window.
          Judge ONLY these presentation criteria; do NOT attempt to verify the numeric
          values, and do NOT treat unverifiable figures as fabricated.
        min_score: 0.7

  - id: refuses_missing_ticker
    input: "How correlated were AAPL and ZZZTOP daily returns in the first half of 2025 (2025-01-01 to 2025-06-30)?"
    checks:
      - type: trajectory
        must_call: [compute_correlation]
      - type: judge
        rubric: >
          The answer makes clear it could NOT compute the correlation because ZZZTOP is
          not in the warehouse, and names ZZZTOP as the problem. It must NOT fabricate a
          correlation value for the missing ticker.
        min_score: 0.7
