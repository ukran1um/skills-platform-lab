[project]
name = "lab-data-mcp"
version = "0.1.0"
description = "Capability-token-validated MCP server over the price warehouse"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2",
    "pyjwt>=2.8",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "lab-common",
    "lab-data",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_mcp"]

[tool.uv.sources]
lab-common = { workspace = true }
lab-data = { workspace = true }
